name: Deploy Website
on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  web-deploy:
    name: Deploy
    runs-on: ubuntu-latest
    # GitHub Environment secrets are available only after the job selects
    # the environment where those secrets were created.
    environment: production
    steps:
      - name: Get latest code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate backend handlers
        run: npm run check:function

      - name: Build
        env:
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Derive Supabase project ref
        id: derive-project-ref
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        run: |
          if [[ "$SUPABASE_URL" =~ ^https://([a-z0-9]+)\.supabase\.co/?$ ]]; then
            project_ref="${BASH_REMATCH[1]}"
            echo "SUPABASE_PROJECT_REF=$project_ref" >> "$GITHUB_ENV"
            echo "project_ref=$project_ref" >> "$GITHUB_OUTPUT"
          else
            echo "SUPABASE_URL must be a standard https://<project-ref>.supabase.co URL"
            exit 1
          fi

      - name: Check Supabase migration state (read-only)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ steps.derive-project-ref.outputs.project_ref }}
        run: |
          set -euo pipefail
          : "${SUPABASE_ACCESS_TOKEN:?Add SUPABASE_ACCESS_TOKEN to the production GitHub Environment}"
          : "${SUPABASE_DB_PASSWORD:?Add SUPABASE_DB_PASSWORD to the production GitHub Environment}"
          : "${SUPABASE_PROJECT_REF:?Could not derive the Supabase project ref}"

          echo "Comparing local migration files with the remote migration history..."
          supabase migration list --remote="$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

          echo "Checking for pending migrations with a non-applying dry run..."
          dry_run_output="$(supabase db push --dry-run --remote="$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD" 2>&1)"
          printf '%s\n' "$dry_run_output"
          if grep -Eiq 'Would (push|apply) migration ' <<<"$dry_run_output"; then
            echo "::error::Unapplied database migration(s) detected. Apply them through the reviewed migration procedure, then rerun this workflow. This workflow does not apply database SQL."
            exit 1
          fi

      - name: Configure Supabase function secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
        run: |
          : "${SUPABASE_ACCESS_TOKEN:?Add SUPABASE_ACCESS_TOKEN to the production GitHub Environment}"
          : "${CLOUDINARY_CLOUD_NAME:?Add CLOUDINARY_CLOUD_NAME to the production GitHub Environment}"
          : "${CLOUDINARY_API_KEY:?Add CLOUDINARY_API_KEY to the production GitHub Environment}"
          : "${CLOUDINARY_API_SECRET:?Add CLOUDINARY_API_SECRET to the production GitHub Environment}"
          supabase secrets set --remote="$SUPABASE_PROJECT_REF" --yes \
            "CLOUDINARY_CLOUD_NAME=$CLOUDINARY_CLOUD_NAME" \
            "CLOUDINARY_API_KEY=$CLOUDINARY_API_KEY" \
            "CLOUDINARY_API_SECRET=$CLOUDINARY_API_SECRET"

      - name: Deploy Supabase Edge Function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy app --remote="$SUPABASE_PROJECT_REF" --use-api --yes

      - name: Sync files
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: dist/
          server-dir: /htdocs/
