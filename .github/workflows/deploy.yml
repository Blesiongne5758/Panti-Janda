name: Deploy Website
on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  web-deploy:
    name: Deploy
    runs-on: ubuntu-latest
    # GitHub Environment secrets are available only after the job selects
    # the environment where those secrets were created.
    environment: production
    steps:
      - name: Get latest code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2

      - name: Configure Supabase function secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
        run: |
          : "${SUPABASE_ACCESS_TOKEN:?Add SUPABASE_ACCESS_TOKEN to the production GitHub Environment}"
          : "${SUPABASE_PROJECT_REF:?Add SUPABASE_PROJECT_REF to the production GitHub Environment}"
          : "${CLOUDINARY_CLOUD_NAME:?Add CLOUDINARY_CLOUD_NAME to the production GitHub Environment}"
          : "${CLOUDINARY_API_KEY:?Add CLOUDINARY_API_KEY to the production GitHub Environment}"
          : "${CLOUDINARY_API_SECRET:?Add CLOUDINARY_API_SECRET to the production GitHub Environment}"
          supabase secrets set --project-ref "$SUPABASE_PROJECT_REF" \
            "CLOUDINARY_CLOUD_NAME=$CLOUDINARY_CLOUD_NAME" \
            "CLOUDINARY_API_KEY=$CLOUDINARY_API_KEY" \
            "CLOUDINARY_API_SECRET=$CLOUDINARY_API_SECRET"

      - name: Deploy Supabase Edge Function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: supabase functions deploy app --project-ref "$SUPABASE_PROJECT_REF" --use-api

      - name: Sync files
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: dist/
          server-dir: /htdocs/
