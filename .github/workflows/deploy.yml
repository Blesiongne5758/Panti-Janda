name: Deploy Website
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      apply_approved_coin_migration:
        description: "Apply migration 007 only if it is the sole pending migration"
        required: false
        type: boolean
        default: false

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  web-deploy:
    name: Deploy
    runs-on: ubuntu-latest
    # GitHub Environment secrets are available only after the job selects
    # the environment where those secrets were created.
    environment: production
    steps:
      - name: Get latest code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate backend handlers
        run: npm run check:function

      - name: Verify production deployment secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          : "${SUPABASE_URL:?Add SUPABASE_URL to the production GitHub Environment}"
          : "${SUPABASE_ANON_KEY:?Add SUPABASE_ANON_KEY to the production GitHub Environment}"
          : "${SUPABASE_ACCESS_TOKEN:?Add SUPABASE_ACCESS_TOKEN to the production GitHub Environment}"
          : "${SUPABASE_DB_PASSWORD:?Add SUPABASE_DB_PASSWORD to the production GitHub Environment}"
          : "${FTP_SERVER:?Add FTP_SERVER to the production GitHub Environment}"
          : "${FTP_USERNAME:?Add FTP_USERNAME to the production GitHub Environment}"
          : "${FTP_PASSWORD:?Add FTP_PASSWORD to the production GitHub Environment}"

      - name: Build
        env:
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Derive Supabase project ref
        id: derive-project-ref
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        run: |
          if [[ "$SUPABASE_URL" =~ ^https://([a-z0-9]+)\.supabase\.co/?$ ]]; then
            project_ref="${BASH_REMATCH[1]}"
            echo "SUPABASE_PROJECT_REF=$project_ref" >> "$GITHUB_ENV"
            echo "project_ref=$project_ref" >> "$GITHUB_OUTPUT"
          else
            echo "SUPABASE_URL must be a standard https://<project-ref>.supabase.co URL"
            exit 1
          fi

      - name: Check and optionally apply the approved coin migration
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ steps.derive-project-ref.outputs.project_ref }}
          APPLY_APPROVED_COIN_MIGRATION: ${{ github.event_name == 'workflow_dispatch' && inputs.apply_approved_coin_migration || 'false' }}
        run: |
          set -euo pipefail
          : "${SUPABASE_ACCESS_TOKEN:?Add SUPABASE_ACCESS_TOKEN to the production GitHub Environment}"
          : "${SUPABASE_DB_PASSWORD:?Add SUPABASE_DB_PASSWORD to the production GitHub Environment}"
          : "${SUPABASE_PROJECT_REF:?Could not derive the Supabase project ref}"

          echo "Comparing local migration files with the remote migration history..."
          supabase migration list --remote="$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

          echo "Checking for pending migrations with a non-applying dry run..."
          dry_run_output="$(supabase db push --include-all --dry-run --remote="$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD" 2>&1)"
          printf '%s\n' "$dry_run_output"
          pending_lines="$(grep -Ei 'Would (push|apply) migration ' <<<"$dry_run_output" || true)"
          if [[ -z "$pending_lines" ]] && grep -Eiq 'Would (push|apply)' <<<"$dry_run_output"; then
            echo "::error::Unrecognized pending-migration output; refusing to apply or deploy."
            exit 1
          fi

          if [[ -n "$pending_lines" ]]; then
            if [[ "$APPLY_APPROVED_COIN_MIGRATION" != "true" ]]; then
              echo "::error::Pending migration(s) detected. For the approved migration, rerun Deploy Website manually with apply_approved_coin_migration=true."
              exit 1
            fi

            pending_count="$(printf '%s\n' "$pending_lines" | grep -c .)"
            if [[ "$pending_count" != "1" ]] || ! grep -Eiq 'Would (push|apply) migration 007(_coin_contribution_flows)?(\.sql)?([[:space:]]|$)' <<<"$pending_lines"; then
              echo "::error::Only 007_coin_contribution_flows may be applied by this authorization. Reconcile any other pending migration separately."
              exit 1
            fi

            echo "Applying the single approved migration 007..."
            supabase db push --include-all --remote="$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

            echo "Verifying migration history and confirming no pending migrations remain..."
            supabase migration list --remote="$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
            postflight_output="$(supabase db push --include-all --dry-run --remote="$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD" 2>&1)"
            printf '%s\n' "$postflight_output"
            if grep -Eiq 'Would (push|apply)' <<<"$postflight_output"; then
              echo "::error::Migration postflight still reports pending changes; refusing to deploy."
              exit 1
            fi
          fi

      # Deploy the application router so new chat actions are available in production.
      - name: Deploy application Edge Function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ steps.derive-project-ref.outputs.project_ref }}
        run: supabase functions deploy app --remote="$SUPABASE_PROJECT_REF" --use-api --no-verify-jwt --yes

      - name: Deploy private chat-storage Edge Function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ steps.derive-project-ref.outputs.project_ref }}
        run: supabase functions deploy chat-storage --remote="$SUPABASE_PROJECT_REF" --use-api --no-verify-jwt --yes

      - name: Sync files
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: dist/
          server-dir: /htdocs/
